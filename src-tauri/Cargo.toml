[package]
name = "tydora"
version = "0.1.7"
description = "A modern Markdown editor built with Tauri"
authors = ["you"]
edition = "2021"

[lib]
name = "tydora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = { version = "2", features = ["default"] }
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
reqwest = { version = "0.12", features = ["json", "gzip", "deflate", "brotli"] }
base64 = "0.22"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"

# 本地 patch wry：修复 Windows 上窗口销毁瞬间仍有 WebResourceRequested
# 回调在途时，wry 向已失效窗口句柄 PostMessageW 失败并打印误导性错误
# （"PostMessage failed; is the messages queue full?" 0x80070578）的问题。
# 参见 vendor/wry/src/webview2/mod.rs 的 dispatch_handler。
[patch.crates-io]
wry = { path = "vendor/wry" }
